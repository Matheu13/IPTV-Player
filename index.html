    <script>
      // Suppress benign Vite dev server HMR websocket disconnections in sandbox environment
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && (event.reason ? (event.reason.message || event.reason) : '');
        var str = String(reason);
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = event && (event.message || '');
        var str = String(msg);
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
