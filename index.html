<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPTV Player &amp; Diagnostics</title>
    <meta name="description" content="Cinematic Command OS IPTV Player Suite with multi-source failover, hardware-accelerated playback pipeline, multi-density EPG &amp; channel virtualization, and advanced diagnostics." />
    <meta property="og:title" content="IPTV Player &amp; Diagnostics" />
    <meta property="og:description" content="Cinematic Command OS IPTV Player Suite with multi-source failover, hardware-accelerated playback pipeline, multi-density EPG &amp; channel virtualization, and advanced diagnostics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress benign Vite dev server HMR websocket disconnections in container sandbox
      (function() {
        function isViteWsError(val) {
          if (!val) return false;
          var str = '';
          if (typeof val === 'string') {
            str = val;
          } else if (val instanceof Error) {
            str = (val.message || '') + ' ' + (val.stack || '') + ' ' + (val.name || '');
          } else if (typeof val === 'object') {
            try {
              str = JSON.stringify(val);
            } catch (e) {
              str = String(val);
            }
          }
          return str.indexOf('WebSocket') !== -1 ||
                 str.indexOf('websocket') !== -1 ||
                 str.indexOf('ws://') !== -1 ||
                 str.indexOf('wss://') !== -1;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event.reason)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isViteWsError(event.message) || isViteWsError(event.error)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return false;
          }
        }, true);

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteWsError(arguments[i])) return;
          }
          origWarn.apply(console, arguments);
        };

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteWsError(arguments[i])) return;
          }
          origError.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
